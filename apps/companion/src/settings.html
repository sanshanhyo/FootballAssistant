<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Football Assistant · 设置</title><link rel="stylesheet" href="settings.css"></head>
<body><header id="window-bar"><div class="window-drag" aria-hidden="true"></div><div class="window-controls"><button id="window-minimize" type="button" aria-label="最小化" title="最小化">—</button><button id="window-maximize" type="button" aria-label="最大化或还原" title="最大化或还原">□</button><button id="window-close" type="button" aria-label="关闭设置" title="关闭设置">×</button></div></header><div class="settings-app"><aside class="sidebar"><nav aria-label="设置分类">
<button class="nav-item active" data-page="connection" aria-controls="page-connection" aria-current="page">连接</button>
<button class="nav-item" data-page="voice" aria-controls="page-voice">输入</button>
<button class="nav-item" data-page="records" aria-controls="page-records">历史与记忆</button>
<button class="nav-item" data-page="appearance" aria-controls="page-appearance">外观</button></nav>
<button class="nav-item about-nav" data-page="about" aria-controls="page-about">关于</button></aside>
<main><header class="page-header"><h1 id="page-title">连接</h1></header>
<div id="notice" class="notice" role="status" hidden></div><div id="error" class="notice error" role="alert" hidden></div>
<section id="page-connection" class="settings-page" aria-labelledby="page-title">
<section class="card"><div class="card-heading"><h2>API 配置</h2><span id="connection-status" role="status">连接未确认</span></div>
<form id="model-config-form" autocomplete="off">
<div class="setting-row"><label for="model-provider">服务商</label><select id="model-provider" disabled><option value="">正在读取…</option></select></div>
<div id="custom-url-row" class="setting-row" hidden><label for="model-base-url">服务器地址</label><input id="model-base-url" type="url" maxlength="2048" spellcheck="false"></div>
<div class="setting-row"><label for="model-api-key">API Key</label><input id="model-api-key" type="password" maxlength="8192" autocomplete="new-password" spellcheck="false"></div>
<div class="setting-row"><label for="model-name">模型</label><div class="model-controls"><select id="model-name" required disabled><option value="">未读取</option></select><button id="model-fetch" type="button" class="secondary-button">读取模型</button></div></div>
<div class="card-actions"><span id="model-storage-note" role="status"></span><div class="row-actions"><button id="model-remove-key" type="button" class="text-button danger">清除密钥</button><button id="model-save" type="submit" class="primary-button" disabled>保存</button></div></div></form></section></section>
<section id="page-voice" class="settings-page" aria-labelledby="page-title" hidden><section class="card"><h2>语音转文字</h2><div class="setting-row"><label for="stt-provider">转写服务</label><select id="stt-provider" disabled></select></div><div id="stt-note" role="status">状态未确认</div></section></section>
<section id="page-companion" class="settings-page" aria-labelledby="page-title" hidden inert>
<section class="card"><div class="card-heading"><h2>persona.md</h2><button id="persona-refresh" class="secondary-button">刷新</button></div><label class="sr-only" for="persona-content">人设内容</label><textarea id="persona-content" rows="10" spellcheck="false" disabled></textarea><div class="card-actions"><span id="persona-status" role="status">未读取</span><div class="row-actions"><button id="persona-open-file" class="text-button" disabled>打开文件</button><button id="persona-open-folder" class="text-button" disabled>打开文件夹</button><button id="persona-save" class="primary-button" disabled>保存</button></div></div></section>
<section class="card"><div class="card-heading"><label for="proactivity">主动性</label><output id="proactivity-value" for="proactivity">80%</output></div><input id="proactivity" type="range" min="0" max="100" step="1" value="80"></section>
<section class="card"><div class="setting-row first-row"><label for="expression">表情</label><select id="expression" disabled><option value="auto">跟随交互</option></select></div></section></section>
      <section id="page-records" class="settings-page" aria-labelledby="page-title" hidden>
        <section class="card"><div class="card-heading"><h2>聊天历史</h2><button id="new-conversation" class="secondary-button">新对话</button></div><label class="switch-row" for="history-enabled"><span><strong>跨启动保留聊天历史</strong></span><input id="history-enabled" type="checkbox" role="switch"></label><div class="card-actions"><span id="history-count" class="value-label">正在读取…</span><div class="row-actions"><button id="refresh-history" class="text-button">刷新</button><button id="clear-history" class="text-button danger">清除历史</button></div></div><div id="history-list" class="records-list"></div><button id="history-more" class="text-button" hidden>显示更多历史</button></section>
        <section class="card"><div class="card-heading"><h2>明确保存的记忆</h2><span id="memory-count" class="value-label">0 条</span></div><label class="sr-only" for="memory-text">要保存的记忆内容</label><textarea id="memory-text" maxlength="2000" rows="3" placeholder="输入希望长期保留的内容…"></textarea><div class="card-actions"><button id="save-memory" class="primary-button">保存这条记忆</button></div><div id="memory-list" class="records-list"></div></section>
      </section>

<section id="page-appearance" class="settings-page" aria-labelledby="page-title" hidden><section class="card"><div class="setting-row first-row"><label for="font-family">字体</label><select id="font-family"><option value="system">系统字体</option><option value="sans">无衬线</option><option value="serif">衬线</option><option value="mono">等宽</option></select></div><div class="setting-row"><label for="font-size">字号</label><select id="font-size"><option value="13">13</option><option value="14">14</option><option value="16">16</option><option value="18">18</option></select></div><div class="setting-row"><label for="bubble-duration-mode">对白消失时间</label><select id="bubble-duration-mode"><option value="auto">自动（按字数，2.2–8 秒）</option><option value="fixed">固定秒数（每段）</option></select></div><div id="bubble-duration-row" class="setting-row" hidden><label for="bubble-duration-seconds">停留秒数（2–60）</label><input id="bubble-duration-seconds" type="number" min="2" max="60" step="1" value="8"></div><p>鼠标停留或键盘聚焦对白时暂停计时；离开后重新计时。点击或按回车翻页。</p><label class="switch-row" for="dark-mode"><span>深色模式</span><input id="dark-mode" type="checkbox" role="switch" checked></label><label class="switch-row" for="light-motion"><span>轻动效</span><input id="light-motion" type="checkbox" role="switch" checked></label></section></section>
<section id="page-about" class="settings-page" aria-labelledby="page-title" hidden><section class="about-content"><img class="app-icon" src="../packaging/assets/icon.png" alt="Football Assistant"><h2>Football Assistant</h2><div id="app-version">版本未确认</div><div id="update-status" role="status"></div><div class="row-actions"><button id="update-check" class="primary-button" disabled>检查更新</button><button id="update-open-release" class="secondary-button">下载页</button><button id="update-download" class="secondary-button" disabled>下载更新</button></div><div class="row-actions"><button id="open-repository" class="text-button">代码仓库</button><button id="open-contributors" class="text-button">贡献者</button></div></section></section>
</main></div><script src="appearance.js"></script>
  <script src="ui-state.js"></script><script src="settings.js"></script></body></html>
