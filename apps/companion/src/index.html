<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FootballAssistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="companion">
    <section id="panel" aria-label="与足球伙伴聊天">
      <header><div><span class="eyebrow">FOOTBALL ASSISTANT</span><h1>更衣室伙伴</h1></div><button id="collapse" class="icon" aria-label="收起聊天">−</button></header>
      <div class="connection"><span id="dot" class="dot"></span><span id="connection">正在连接服务…</span><button id="reconnect" aria-label="刷新连接">↻</button></div>
      <p id="source" class="source">等待游戏数据</p>
      <section class="monitor" aria-label="持续数据监听"><p id="monitor-state">持续监听正在连接…</p><p id="monitor-coverage">已验证数据可用状态待更新</p><p id="monitor-note">原生包头接收不等于字段值已解码 · 业务数据仍部分待解码</p><p id="monitor-change">尚无变化记录</p><details id="monitor-diagnostics"><summary>开发诊断</summary><p id="monitor-catalogs">接口结构清单待接入</p><p id="monitor-probes">最近显式探测数据待接入</p><p id="monitor-integrity">登记完整性待接入</p></details></section>
      <div id="messages" role="log" aria-live="polite"><p class="message assistant">我在场边等你。接通服务后，我们一起聊聊你的球队。</p></div>
      <p id="error" role="alert" hidden></p>
      <form id="chat-form"><label class="sr-only" for="message">给伙伴发消息</label><textarea id="message" maxlength="4000" rows="2" placeholder="聊聊今天的训练和比赛…"></textarea><button id="send" type="submit">发送 <span>↗</span></button></form>
      <footer><label><input id="auto-speak" type="checkbox" checked> 自动朗读</label><button id="read-last" disabled>朗读回复</button><button id="stop-speech">停止</button><span id="speech-status"></span></footer>
      <div class="settings"><button id="choose-runtime">选择连接文件</button><span>本机 · 基础记忆</span><button id="quit">退出</button></div>
    </section>
    <div id="pet-wrap"><span id="pet-hint">点击聊天 · 按住拖动</span><button id="pet" aria-label="足球伙伴，点击聊天，按住拖动"><span class="ball"><i></i></span><span class="scarf"></span><span class="eye left"></span><span class="eye right"></span><span class="smile"></span><span class="foot left"></span><span class="foot right"></span></button></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
