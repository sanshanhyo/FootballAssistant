<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FootballAssistant · 桌宠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="companion">
    <section id="compact-bubble" aria-label="桌宠消息气泡">
      <div class="bubble-top"><div id="message-badges" class="badges"><span class="badge synthetic">模拟模式</span></div><span id="message-origin" class="message-origin">桌宠</span></div>
      <p id="compact-text" role="status">单击桌宠输入消息，长按说话。</p>
      <p id="error" role="alert" hidden></p>
      <section id="voice-feedback" class="voice-feedback" aria-live="polite" hidden><span id="recording-dot"></span><span id="voice-status"></span><button id="cancel-voice" class="quiet-button">取消</button></section>
      <details id="tasks" class="task-details" hidden><summary id="task-summary">正在处理信息…</summary><div id="task-list"></div></details>
      <details id="message-details" class="message-details" hidden><summary>来源与信息卡</summary><div id="message-detail-content"></div></details>
      <div class="bubble-actions"><nav id="message-navigation" aria-label="浏览桌宠消息" hidden><button id="previous-message" class="quiet-button" aria-label="上一条消息">‹</button><span id="message-count"></span><button id="next-message" class="quiet-button" aria-label="下一条消息">›</button></nav><button id="read-last" class="quiet-button" disabled>朗读</button><button id="stop-speech" class="quiet-button" hidden>停止</button></div>
    </section>
    <div id="pet-wrap"><span id="pet-hint">单击打字 · 长按说话<br><span>拖动移动 · 右键设置</span></span><button id="pet" data-expression="idle" aria-expanded="false" aria-controls="chat-form" aria-label="桌宠：单击打字，长按说话，拖动移动，右键设置"><img id="character-image" class="character-visual" alt="" draggable="false" hidden><span id="character-visual-error" hidden>角色图未载入</span><span id="expression-label">待机</span></button></div>
    <section id="input-dock" aria-label="文字输入区域"><form id="chat-form" aria-label="给桌宠发消息" hidden><label class="sr-only" for="message">消息内容</label><textarea id="message" maxlength="4000" rows="1" placeholder="输入消息…" aria-describedby="draft-note"></textarea><button id="send" type="submit" disabled aria-label="发送消息" title="发送 · Enter">↑</button></form><p id="draft-note" hidden>Enter 发送 · Shift + Enter 换行</p></section>
  </main>
  <script src="ui-state.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
