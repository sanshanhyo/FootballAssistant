name: Companion desktop

on:
  workflow_dispatch:
  push:
    paths:
      - apps/companion/**
      - modules/game-bridge/**
      - modules/data-core/**
      - modules/agent-core/**
      - contracts/**
      - scripts/*desktop_backend.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/companion/**
      - modules/game-bridge/**
      - modules/data-core/**
      - modules/agent-core/**
      - contracts/**
      - scripts/*desktop_backend.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            artifact: macos-arm64
          - os: windows-latest
            target: win
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.target == 'mac' && 'arm64' || 'x64' }}
      - name: Build embedded backend (no Python needed by end users)
        working-directory: .
        run: |
          python -c "import platform,sys; assert platform.machine().lower() in (('arm64','aarch64') if sys.platform == 'darwin' else ('amd64','x86_64')), 'Backend architecture must match Electron target'"
          python -m pip install ".[agent]" "pyinstaller==6.16.0"
          python scripts/build_desktop_backend.py
          python scripts/smoke_desktop_backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Verify GameBridge offline transport on Windows
        if: runner.os == 'Windows'
        working-directory: .
        run: dotnet run --project modules/game-bridge/tests/SelfTest.csproj
      - name: Verify Windows native speech synthesis
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $speaker = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $outputPath = Join-Path $env:RUNNER_TEMP 'football-assistant-tts.wav'
            $speaker.SetOutputToWaveFile($outputPath)
            $speaker.Speak('Football Assistant speech smoke test')
          } finally { $speaker.Dispose() }
          if ((Get-Item $outputPath).Length -le 44) { throw 'TTS output is empty' }
      - name: Package desktop
        run: npm run pack:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke distributed Windows portable EXE (cold start with embedded backend)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FOOTBALL_ASSISTANT_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'companion-smoke.json'
          $env:FOOTBALL_ASSISTANT_SMOKE_EXIT = '1'
          $env:FA_COMPANION_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'portable-clean-profile'
          $portable = Get-ChildItem '.\dist\FootballAssistant-*-win-x64.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Single-file portable distribution is missing' }
          $appProcess = Start-Process $portable.FullName -PassThru
          if (-not $appProcess.WaitForExit(60000)) {
            $appProcess.Kill()
            throw 'Packaged desktop smoke timed out'
          }
          if ($appProcess.ExitCode -ne 0) { throw 'Packaged desktop failed to launch' }
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $env:FOOTBALL_ASSISTANT_SMOKE_REPORT) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path (Join-Path $env:FA_COMPANION_USER_DATA_DIR 'settings.json'))) { throw 'First-run settings not generated' }
          $report = Get-Content $env:FOOTBALL_ASSISTANT_SMOKE_REPORT -Raw | ConvertFrom-Json
          if ($report.platform -ne 'win32' -or $report.arch -ne 'x64') { throw 'Unexpected desktop target' }
          if ($report.bootstrap.backend.state -ne 'ready') { throw 'Embedded backend did not become ready' }
          if (-not $report.renderer.bridge -or $report.renderer.nodeExposed) { throw 'Desktop isolation check failed' }
      - name: Archive macOS application preserving executable permissions
        if: runner.os == 'macOS'
        run: tar -czf dist/FootballAssistant-macos-arm64.tar.gz -C dist/mac-arm64 FootballAssistant.app
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.artifact }}
          path: |
            apps/companion/dist/*.exe
            apps/companion/dist/*.zip
            apps/companion/dist/*.tar.gz
            ${{ runner.temp }}/companion-smoke.*
          if-no-files-found: error
          retention-days: 7
