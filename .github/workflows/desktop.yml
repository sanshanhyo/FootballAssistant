name: Companion desktop

on:
  workflow_dispatch:
    inputs:
      prepare_alpha:
        description: Prepare signed Alpha artifacts without publishing
        type: boolean
        default: false
      alpha_version:
        description: New immutable version (X.Y.Z-alpha.N)
        type: string
      previous_alpha_version:
        description: Previous highest distributed Alpha version
        type: string
  push:
    paths:
      - apps/companion/**
      - modules/game-bridge/**
      - modules/data-core/**
      - modules/agent-core/**
      - contracts/**
      - scripts/*desktop_backend.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/companion/**
      - modules/game-bridge/**
      - modules/data-core/**
      - modules/agent-core/**
      - contracts/**
      - scripts/*desktop_backend.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            artifact: macos-arm64
          - os: windows-latest
            target: win
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.target == 'mac' && 'arm64' || 'x64' }}
      - name: Build embedded backend (no Python needed by end users)
        working-directory: .
        run: |
          python -c "import platform,sys; assert platform.machine().lower() in (('arm64','aarch64') if sys.platform == 'darwin' else ('amd64','x86_64')), 'Backend architecture must match Electron target'"
          python -m pip install ".[agent]" "pyinstaller==6.16.0"
          python scripts/build_desktop_backend.py
          python scripts/smoke_desktop_backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json
      - name: Prepare monotonic Alpha version without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_alpha
        run: |
          if (process.env.GITHUB_REF !== 'refs/heads/integration/alpha-reader-ui') throw new Error('Alpha preparation is restricted to integration/alpha-reader-ui');
          require(process.cwd() + '/packaging/prepare-alpha.cjs').prepare({ appRoot: process.cwd(), version: process.env.FA_ALPHA_VERSION, previousVersion: process.env.FA_ALPHA_PREVIOUS_VERSION }).catch(error => { console.error(error.message); process.exitCode = 1; });
        shell: node {0}
        env:
          FA_ALPHA_VERSION: ${{ inputs.alpha_version }}
          FA_ALPHA_PREVIOUS_VERSION: ${{ inputs.previous_alpha_version }}
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Verify GameBridge offline transport on Windows
        if: runner.os == 'Windows'
        working-directory: .
        run: dotnet run --project modules/game-bridge/tests/SelfTest.csproj
      - name: Verify Windows native speech synthesis
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $speaker = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $outputPath = Join-Path $env:RUNNER_TEMP 'football-assistant-tts.wav'
            $speaker.SetOutputToWaveFile($outputPath)
            $speaker.Speak('Football Assistant speech smoke test')
          } finally { $speaker.Dispose() }
          if ((Get-Item $outputPath).Length -le 44) { throw 'TTS output is empty' }
      - name: Build and verify bundled local Whisper (CPU-only, 31 MiB multilingual model)
        run: python packaging/build-local-stt.py
      - name: Package desktop
        run: npm run pack:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Audit actual packaged notices and retained license hashes
        shell: bash
        run: node packaging/audit-notices.cjs "" "$RUNNER_TEMP/companion-notices.json"
      - name: Upload package notice inventory (not legal approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-notices-${{ matrix.target }}
          path: ${{ runner.temp }}/companion-notices.json
          if-no-files-found: warn
          retention-days: 7
      - name: Smoke distributed Windows portable EXE (cold start with embedded backend)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FOOTBALL_ASSISTANT_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'companion-smoke.json'
          $env:FOOTBALL_ASSISTANT_SMOKE_EXIT = '1'
          $env:FA_COMPANION_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'portable-clean-profile'
          $portable = Get-ChildItem '.\dist\FootballAssistant-*-Portable-x64.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Single-file portable distribution is missing' }
          $appProcess = Start-Process $portable.FullName -PassThru
          if (-not $appProcess.WaitForExit(60000)) {
            $appProcess.Kill()
            throw 'Packaged desktop smoke timed out'
          }
          if ($appProcess.ExitCode -ne 0) { throw 'Packaged desktop failed to launch' }
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $env:FOOTBALL_ASSISTANT_SMOKE_REPORT) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path (Join-Path $env:FA_COMPANION_USER_DATA_DIR 'settings.json'))) { throw 'First-run settings not generated' }
          $report = Get-Content $env:FOOTBALL_ASSISTANT_SMOKE_REPORT -Raw | ConvertFrom-Json
          if ($report.platform -ne 'win32' -or $report.arch -ne 'x64') { throw 'Unexpected desktop target' }
          if ($report.bootstrap.backend.state -ne 'ready') { throw 'Embedded backend did not become ready' }
          if (-not $report.renderer.bridge -or $report.renderer.nodeExposed) { throw 'Desktop isolation check failed' }
          if (-not $report.renderer.ipcOk -or -not $report.settingsRenderer.ipcOk -or -not $report.settingsRenderer.aboutOk -or -not $report.settingsRenderer.customControls) { throw 'Packaged window IPC/controls check failed' }
      - name: Verify NSIS installation, reinstall and uninstall preserve user data
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/nsis-smoke.ps1
      - name: Verify real two-version NSIS automatic upgrade (disposable fixture)
        if: runner.os == 'Windows'
        run: |
          node test/update-native-fixture.cjs
          node test/assert-update-fixture.cjs
      - name: Prepare signed Alpha manifest without publishing
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.prepare_alpha && github.ref == 'refs/heads/integration/alpha-reader-ui'
        run: node packaging/sign-alpha-update.cjs
        env:
          FA_ALPHA_UPDATE_SIGNING_KEY: ${{ secrets.FA_ALPHA_UPDATE_SIGNING_KEY }}
      - name: Verify macOS bundle signature integrity (not notarization)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/mac-arm64/FootballAssistant.app"
          codesign -dv --verbose=4 "$APP" > "$RUNNER_TEMP/companion-mac-signature-info.txt" 2>&1 || true
          set +e
          codesign --verify --deep --strict --verbose=2 "$APP" > "$RUNNER_TEMP/companion-mac-signature-verify.txt" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/companion-mac-signature-info.txt"
          cat "$RUNNER_TEMP/companion-mac-signature-verify.txt"
          printf '{"signatureIntegrityPassed":%s,"exitCode":%s,"notarizationVerified":false}\n' "$([ "$STATUS" -eq 0 ] && echo true || echo false)" "$STATUS" > "$RUNNER_TEMP/companion-mac-signature.json"
          exit "$STATUS"
      - name: Smoke ad-hoc-signed macOS App with embedded backend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PYSMOKE'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          report = root / 'companion-mac-smoke.json'
          env = dict(os.environ, FOOTBALL_ASSISTANT_SMOKE_REPORT=str(report), FOOTBALL_ASSISTANT_SMOKE_EXIT='1', FA_COMPANION_USER_DATA_DIR=str(root / 'mac-clean-profile'))
          result = subprocess.run(['dist/mac-arm64/FootballAssistant.app/Contents/MacOS/FootballAssistant'], env=env, timeout=120, capture_output=True, text=True)
          (root / 'companion-mac-smoke-launch.txt').write_text(result.stdout + result.stderr)
          if result.returncode: raise RuntimeError(f'Mac App cold start failed: {result.returncode}')
          data = json.loads(report.read_text())
          assert data['platform'] == 'darwin' and data['arch'] == 'arm64'
          assert data['bootstrap']['backend']['state'] == 'ready', 'Embedded backend not ready'
          assert data['renderer']['bridge'] and not data['renderer']['nodeExposed'], 'Renderer isolation failed'
          PYSMOKE
      - name: Upload macOS signature diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: companion-macos-signature-diagnostics
          path: |
            ${{ runner.temp }}/companion-mac-signature*
            ${{ runner.temp }}/companion-mac-smoke*
          if-no-files-found: warn
          retention-days: 7
      - name: Archive macOS application preserving executable permissions
        if: runner.os == 'macOS'
        run: tar -czf dist/FootballAssistant-macos-arm64.tar.gz -C dist/mac-arm64 FootballAssistant.app
      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: companion-macos-arm64
          path: apps/companion/dist/FootballAssistant-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows installer separately
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows-setup-x64
          path: apps/companion/dist/FootballAssistant-*-Setup-x64.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows portable separately
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows-portable-x64
          path: apps/companion/dist/FootballAssistant-*-Portable-x64.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows update metadata
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows-update-metadata-x64
          path: |
            apps/companion/dist/*.blockmap
            apps/companion/dist/*.yml
            apps/companion/dist/alpha-update.json
              apps/companion/dist/alpha-release-plan.json
              apps/companion/alpha-preparation.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows smoke diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows-diagnostics-x64
          path: ${{ runner.temp }}/companion-smoke*
          if-no-files-found: error
          retention-days: 7
