name: Windows bridge probe (no game)
on:
  workflow_dispatch:
  push:
    paths: ['modules/game-bridge/**', 'modules/data-core/src/football_assistant_data/windows_capture_files.py', 'scripts/diagnostics/windows_capture_transport_smoke.py', '.github/workflows/windows-bridge-probe.yml']
  pull_request:
    paths: ['modules/game-bridge/**', 'modules/data-core/src/football_assistant_data/windows_capture_files.py', 'scripts/diagnostics/windows_capture_transport_smoke.py', '.github/workflows/windows-bridge-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python modules/game-bridge/tests/verify_guard_component_scan.py
      - run: dotnet run --project modules/game-bridge/tests/WindowsProbeTests.csproj
      - name: Offline finite page collector fixtures (no host or game)
        run: dotnet run --project modules/game-bridge/windows-ui-batch-draft/BatchDraftTests.csproj
      - name: Owned-window guard benchmark (baseline, no game)
        if: runner.os == 'Windows'
        run: dotnet run --configuration Release --project modules/game-bridge/tests/WindowsGuardBenchmark.csproj -- baseline
      - name: Owned-window guard benchmark (instrumented, no game)
        if: runner.os == 'Windows'
        run: dotnet run --configuration Release --project modules/game-bridge/tests/WindowsGuardBenchmark.csproj -- components
      - name: Upload numeric guard benchmark results
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-owned-window-guard-benchmark
          path: guard-benchmark-*.json
          if-no-files-found: warn
          retention-days: 7
      - run: dotnet build modules/game-bridge/FootballAssistant.DirectBridge.csproj --configuration Release --output build/windows-probe
      - name: Upload own probe-only bridge and corresponding source (no game/runtime)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-x64-PROBE-ONLY-NO-READS
          path: |
            build/windows-probe/FootballAssistant.GameBridge.dll
            build/windows-probe/FootballAssistant.GameBridge.deps.json
            LICENSE
            modules/game-bridge/FootballAssistant.DirectBridge.csproj
            modules/game-bridge/src/*.cs
            docs/bridge/windows-scheduler-probe.md
            modules/data-core/src/football_assistant_data/windows_capture_files.py
            scripts/diagnostics/windows_capture_transport_smoke.py
          if-no-files-found: error
          retention-days: 7

      - name: Check discovery build and artifact isolation (no game)
        run: python modules/game-bridge/windows-ui-batch-draft/verify_discovery_packaging.py
      - name: Parse discovery helper syntax without executing helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('modules/game-bridge/windows-ui-batch-draft/Prepare-DiscoveryCandidate.ps1', 'modules/game-bridge/windows-ui-batch-draft/Request-Discovery.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Discovery helper syntax errors: $path" }
          }
      - name: Exercise discovery request helper with owned fake session (no game)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./modules/game-bridge/windows-ui-batch-draft/Test-DiscoveryRequestHelper.ps1
      - name: Build separate opt-in discovery candidate (no game)
        run: dotnet build modules/game-bridge/windows-ui-batch-draft/FootballAssistant.WindowsDiscoveryCandidate.csproj --configuration Release --output build/windows-discovery
      - name: Upload disabled-by-default discovery binary and helpers (no configuration or request)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-x64-DISCOVERY-OPT-IN-NO-CONFIG
          path: |
            build/windows-discovery/FootballAssistant.WindowsDiscoveryCandidate.dll
            build/windows-discovery/FootballAssistant.WindowsDiscoveryCandidate.deps.json
            modules/game-bridge/windows-ui-batch-draft/Prepare-DiscoveryCandidate.ps1
            modules/game-bridge/windows-ui-batch-draft/Request-Discovery.ps1
            modules/game-bridge/windows-ui-batch-draft/DISCOVERY.md
            LICENSE
          if-no-files-found: error
          retention-days: 7
