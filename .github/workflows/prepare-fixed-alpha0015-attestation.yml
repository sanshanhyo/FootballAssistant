name: Prepare fixed Alpha 0015 historical attestation only
on:
  push:
    branches: ['prepare/fixed-alpha0015-attestation-20261102']
    paths: ['.github/workflows/prepare-fixed-alpha0015-attestation.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'sanshanhyo/FootballAssistant' && github.ref == 'refs/heads/prepare/fixed-alpha0015-attestation-20261102' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify successful packaged-smoke source and exact fixed installer bytes
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os,json,urllib.request,urllib.error,urllib.parse,hashlib,zipfile,base64,pathlib,re,shutil
          root=pathlib.Path('verified-inputs'); root.mkdir()
          repo='sanshanhyo/FootballAssistant'; api='https://api.github.com/repos/'+repo
          items=[{'version': '0.0.1-alpha.5', 'run': 41439585907, 'head': '7148fcbe2a34223d07c6d67fc1c810ec15c60f26', 'branch': 'fix/windows-install-once', 'setup': 13140630585, 'metadata': 13140940488, 'setupDigest': '441a465abb0e3c30876c616167e4473cc2f78a4b2c2585db5aaf79777353b121', 'metadataDigest': '4dfd4d09f0d16a705c4a115c3c9fefa12d811d9e38ba5960eaa8b6a45b85964c', 'size': 250837834, 'sha256': '061611945b3448973629772d38ea292ddc8d7ccd55406adf0c0736739f37291e', 'sha512': 'sj5FP4f6wCC0eikaoIEBpeErWbeCZHa34+tRhqd5BFQq63Mli9CigG6IPLAw79KXcLR5qroqdJYJse9Q1L7V0g=='}]
          def request(url):
           assert url.startswith(api+'/')
           return urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          def get(path):
           with urllib.request.urlopen(request(api+path),timeout=60) as r: return json.load(r)
          # Any newly published release requires renewed monotonic/channel review, not a silent rebase.
          assert get('/releases?per_page=100')==[], 'Published release baseline changed; review required'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          def download(artifact,target):
           try: urllib.request.build_opener(NoRedirect()).open(request(api+f'/actions/artifacts/{artifact}/zip'),timeout=60)
           except urllib.error.HTTPError as e:
            assert e.code==302
            url=e.headers['Location']; parsed=urllib.parse.urlparse(url)
            assert parsed.scheme=='https' and (parsed.hostname.endswith('.blob.core.windows.net') or parsed.hostname.endswith('.actions.githubusercontent.com'))
            # Do not forward the API bearer credential to the signed blob URL.
            with urllib.request.urlopen(url,timeout=120) as src,open(target,'wb') as dst: shutil.copyfileobj(src,dst)
           else: raise RuntimeError('Expected bounded artifact redirect')
          for item in items:
           run=get(f"/actions/runs/{item['run']}")
           assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==item['head'] and run['head_branch']==item['branch'] and run['path']=='.github/workflows/desktop.yml'
           jobs=get(f"/actions/runs/{item['run']}/jobs")['jobs']
           assert len(jobs)==1 and jobs[0]['conclusion']=='success'
           assert any(step['name']=='Smoke distributed Windows portable EXE (cold start with embedded backend)' and step['conclusion']=='success' for step in jobs[0]['steps'])
           name=f"FootballAssistant-{item['version']}-Setup-x64.exe"; item['name']=name
           dest=root/item['version'];dest.mkdir()
           for kind in ['setup','metadata']:
            info=get(f"/actions/artifacts/{item[kind]}")
            assert not info['expired'] and info['workflow_run']['id']==item['run'] and info['workflow_run']['head_sha']==item['head']
            assert info['name']==('companion-windows-setup-x64' if kind=='setup' else 'companion-windows-update-metadata-x64')
            assert info['digest']=='sha256:'+item[kind+'Digest']
            archive=dest/(kind+'.zip');download(item[kind],archive)
            assert hashlib.file_digest(open(archive,'rb'),'sha256').hexdigest()==item[kind+'Digest']
           with zipfile.ZipFile(dest/'setup.zip') as z:
            assert z.namelist()==[name]
            zi=z.getinfo(name);assert zi.file_size==item['size'] and zi.file_size<2*1024**3
            h=hashlib.sha256(); h512=hashlib.sha512();size=0
            with z.open(name) as src:
             while chunk:=src.read(1024*1024):h.update(chunk);h512.update(chunk);size+=len(chunk)
            assert size==item['size'] and h.hexdigest()==item['sha256'] and base64.b64encode(h512.digest()).decode()==item['sha512']
           with zipfile.ZipFile(dest/'metadata.zip') as z:
            expected={'dist/build-identity.json','dist/builder-debug.yml','dist/'+name+'.blockmap','dist/latest.yml'}
            assert set(z.namelist())==expected and len(z.namelist())==len(expected)
            assert all(i.file_size<4*1024**2 for i in z.infolist())
            identity=json.loads(z.read('dist/build-identity.json'))
            assert identity['schema']==1 and identity['version']==item['version'] and identity['commit']==item['head'] and identity['runId']==str(item['run']) and identity['runAttempt']=='1' and identity['ref']=='refs/heads/'+item['branch'] and identity['releasePublished'] is False
            latest=z.read('dist/latest.yml').decode()
            expected_lines=[f"version: {item['version']}",'files:',f'  - url: {name}',f"    sha512: {item['sha512']}",f"    size: {size}",f'path: {name}',f"sha512: {item['sha512']}"]
            assert latest.splitlines()[:7]==expected_lines and len(latest.splitlines())==8 and re.fullmatch(r"releaseDate: '[0-9T:.Z-]+'",latest.splitlines()[7])
            (dest/'build-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
            (dest/(name+'.blockmap')).write_bytes(z.read('dist/'+name+'.blockmap'))
            (dest/'alpha.yml').write_text(latest)
           item['url']=f'https://github.com/{repo}/releases/download/'+item['version']+'/'+name
           item['originalMetadataName']='latest.yml'
          (root/'evidence.json').write_text(json.dumps(items,indent=2)+'\n')
          print('The immutable installer archive, exact EXE hashes, native metadata and source identities verified; no executable launched.')
      - name: Sign only the fixed historical first-install artifact
        shell: node {0}
        env:
          FA_ALPHA_UPDATE_SIGNING_KEY: ${{ secrets.FA_ALPHA_UPDATE_SIGNING_KEY }}
        run: |
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          try {
           const version='0.0.1-alpha.5',size=250837834,sha256='061611945b3448973629772d38ea292ddc8d7ccd55406adf0c0736739f37291e';
           const name=`FootballAssistant-${version}-Setup-x64.exe`,url=`https://github.com/sanshanhyo/FootballAssistant/releases/download/${version}/${name}`;
           const pin='-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAqkem81H85RqVbk63GZSRR+FirweOMbMvUwsXkNmByf0=\n-----END PUBLIC KEY-----\n';
           const pinned=crypto.createPublicKey(pin),der=pinned.export({type:'spki',format:'der'});
           if(crypto.createHash('sha256').update(der).digest('hex')!=='9e686e777a355634920d5dbf6e63bc282dfc8622ff480a75803b9040538bccfb')throw Error();
           const key=crypto.createPrivateKey(process.env.FA_ALPHA_UPDATE_SIGNING_KEY||'');delete process.env.FA_ALPHA_UPDATE_SIGNING_KEY;
           if(key.asymmetricKeyType!=='ed25519'||!crypto.createPublicKey(key).export({type:'spki',format:'der'}).equals(der))throw Error();
           const evidence=JSON.parse(fs.readFileSync('verified-inputs/evidence.json','utf8'));
           if(evidence.length!==1)throw Error();const item=evidence[0];
           if(item.version!==version||item.sha256!==sha256||item.size!==size||item.name!==name||item.url!==url||item.head!=='7148fcbe2a34223d07c6d67fc1c810ec15c60f26'||item.run!==41439585907)throw Error();
           const payload=JSON.stringify({schema:'footballassistant-artifact-attestation/1',purpose:'historical-first-install-provenance-not-update-feed',version,issuedAt:new Date().toISOString(),artifact:{platform:'win32',arch:'x64',format:'exe',installerType:'nsis',size,sha256,url}});
           const signature=crypto.sign(null,Buffer.from(payload),key).toString('base64');
           if(!crypto.verify(null,Buffer.from(payload),pinned,Buffer.from(signature,'base64')))throw Error();
           const root='signed-historical-metadata';fs.mkdirSync(root);
           fs.writeFileSync(path.join(root,'installer-attestation.json'),JSON.stringify({payload,signature})+'\n');
           for(const file of ['build-identity.json','alpha.yml',name+'.blockmap'])fs.copyFileSync(path.join('verified-inputs',version,file),path.join(root,file));
           fs.writeFileSync(path.join(root,'reviewed-public-key.pem'),pin);
           fs.writeFileSync(path.join(root,'release-plan.json'),JSON.stringify({schema:1,published:false,historicalVersion:version,channelEligible:false,channelManifestPrepared:false,purpose:'historical-first-install-only',supersedesPreparedHistoricalVersion:'0.0.1-alpha.4',oldSignaturesCannotAuthenticateNewInstallerBytes:true,final002Candidate:'not-prepared; requires approved successful new build',publicationGate:'Only after explicit owner acceptance following local debugging; no Release, tag, channel update or main change performed',canonicalAssetUrlIsFutureUnpublishedLocation:true,previousVersion:null,previousVersionReason:'Historical artifact attestation is not an update feed and makes no monotonic automatic-upgrade claim',signature:'Ed25519 artifact attestation; not Windows Authenticode',source:item},null,2)+'\n');
           console.log('Fixed 0.0.1-alpha.5 historical artifact attestation signed and self-verified; no update feed or release published.');
          }catch{process.stderr.write('Historical artifact signing failed.\n');process.exitCode=1;}finally{delete process.env.FA_ALPHA_UPDATE_SIGNING_KEY;}
      - name: Independently verify attestation without signing secret
        shell: node {0}
        run: |
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');const root='signed-historical-metadata';
          const key=crypto.createPublicKey('-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAqkem81H85RqVbk63GZSRR+FirweOMbMvUwsXkNmByf0=\n-----END PUBLIC KEY-----\n');
          const envelope=JSON.parse(fs.readFileSync(root+'/installer-attestation.json'));
          if(!crypto.verify(null,Buffer.from(envelope.payload),key,Buffer.from(envelope.signature,'base64')))throw Error('Signature verification failed');
          const p=JSON.parse(envelope.payload),a=p.artifact;
          if(p.schema!=='footballassistant-artifact-attestation/1'||p.version!=='0.0.1-alpha.5'||'channel'in p||'artifacts'in p||a.size!==250837834||a.sha256!=='061611945b3448973629772d38ea292ddc8d7ccd55406adf0c0736739f37291e'||a.url!=='https://github.com/sanshanhyo/FootballAssistant/releases/download/0.0.1-alpha.5/FootballAssistant-0.0.1-alpha.5-Setup-x64.exe')throw Error('Fixed attestation contract failed');
          const native=fs.readFileSync(root+'/alpha.yml','utf8');if(!native.includes('version: 0.0.1-alpha.5\n')||!native.includes('    size: 250837834\n')||!native.includes('    sha512: sj5FP4f6wCC0eikaoIEBpeErWbeCZHa34+tRhqd5BFQq63Mli9CigG6IPLAw79KXcLR5qroqdJYJse9Q1L7V0g==\n'))throw Error('Native metadata mismatch');
          const report={verifiedAt:new Date().toISOString(),version:p.version,signatureVerified:true,channelEligible:false,installerSha256:a.sha256,installerSize:a.size,publicKeySpkiSha256:crypto.createHash('sha256').update(key.export({type:'spki',format:'der'})).digest('hex'),sourceRun:41439585907,sourceHead:'7148fcbe2a34223d07c6d67fc1c810ec15c60f26',sourceExecutablesExecuted:false,rebuilt:false,published:false};
          fs.writeFileSync(root+'/verification-evidence.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
      - name: Upload public historical attestation and provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: footballassistant-signed-historical-metadata-0015
          path: signed-historical-metadata/
          if-no-files-found: error
          retention-days: 14
